[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "power-backend"
version = "1.0.0"
description = "FastAPI backend for utility outage information in the Novoyavorivsk community."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Iway1231" },
]
keywords = ["fastapi", "outages", "ocr", "telegram", "ukraine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Iway1231/power-backend"
Issues = "https://github.com/Iway1231/power-backend/issues"
Changelog = "https://github.com/Iway1231/power-backend/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", ".venv", "data", "debug", "history"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
