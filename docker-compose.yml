services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      target: runtime
    image: power-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - power_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  power_data:
  redis_data:
