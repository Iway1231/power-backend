services:
  api:
    build:
      context: .
      target: runtime
    image: power-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - power_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  power_data:
