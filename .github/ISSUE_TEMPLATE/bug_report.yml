name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Power Backend.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the endpoint, input post, image, or address if relevant.
      placeholder: |
        1. Call ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or response
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - OCR
        - Telegram parsing
        - Lvivoblenergo lookup
        - Water notices
        - Docker/deployment
        - Documentation
